<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ file_name }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #202124;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }
        .markdown {
    width: 100%;
    color: #202124;
    font-size: 16px;
    line-height: 1.75;
}

.markdown h1 {
    font-size: 36px;
    line-height: 1.25;
    margin: 0 0 25px;
    color: #111827;
}

.markdown h2 {
    font-size: 28px;
    line-height: 1.3;
    margin-top: 38px;
    margin-bottom: 16px;
    color: #111827;
}

.markdown h3 {
    font-size: 22px;
    margin-top: 30px;
    margin-bottom: 12px;
}

.markdown p {
    margin: 14px 0;
}

.markdown ul,
.markdown ol {
    padding-left: 30px;
    margin: 15px 0;
}

.markdown li {
    margin: 6px 0;
}

.markdown blockquote {
    margin: 22px 0;
    padding: 12px 20px;
    border-left: 4px solid #6366f1;
    background: #f5f7ff;
    color: #4b5563;
}

.markdown code {
    padding: 3px 6px;
    border-radius: 5px;
    background: #f1f3f5;
    font-family: Consolas, monospace;
    font-size: 14px;
}

.markdown pre {
    margin: 22px 0;
    padding: 18px;
    border-radius: 10px;
    background: #111827;
    color: #f9fafb;
    overflow-x: auto;
}

.markdown pre code {
    padding: 0;
    background: transparent;
    color: inherit;
}

.markdown table {
    width: 100%;
    border-collapse: collapse;
    margin: 25px 0;
}

.markdown th,
.markdown td {
    border: 1px solid #d1d5db;
    padding: 10px 14px;
    text-align: left;
}

.markdown th {
    background: #f3f4f6;
    font-weight: 600;
}

.markdown a {
    color: #4f46e5;
    text-decoration: none;
}

.markdown a:hover {
    text-decoration: underline;
}

.markdown hr {
    border: 0;
    border-top: 1px solid #e5e7eb;
    margin: 30px 0;
}

.markdown img {
    max-width: 100%;
    border-radius: 8px;
}
    </style>

</head>


<body>

<div class="topbar">

    <button
        class="back"
        onclick="window.history.back()">

        ←

    </button>

    <div class="filename">

        {{ file_name }}

    </div>

</div>


<main class="document">

    <article
        id="markdown"
        class="markdown">{{ markdown_html }}</article>

</main>


<script>

document.addEventListener(
    "mouseup",
    function () {

        const selection =
            window.getSelection();

        if (
            !selection ||
            selection.isCollapsed
        ) {
            return;
        }

        const text =
            selection
                .toString()
                .trim();

        if (!text) {
            return;
        }

        window.parent.postMessage(
            {
                type:
                    "CLOUDNEXUS_MARKDOWN_SELECTION",

                text:
                    text,

                fileId:
                    "{{ file_id }}"
            },

            window.location.origin
        );

    }
);

</script>

</body>

</html>
