<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ file_name }}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #eef1f5;
            color: #202124;
        }


        /* =========================================
           TOP BAR
        ========================================= */

        .topbar {

            height: 58px;

            display: flex;
            align-items: center;

            padding: 0 18px;

            background: #ffffff;

            border-bottom: 1px solid #e5e7eb;

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.08);

            position: relative;
            z-index: 20;
        }


        .back {

            display: flex;
            align-items: center;

            gap: 7px;

            border: 0;

            background: transparent;

            color: #374151;

            font-size: 14px;
            font-weight: 500;

            padding: 8px 10px;

            border-radius: 8px;

            cursor: pointer;
        }


        .back:hover {

            background: #f3f4f6;
        }


        .back-icon {

            font-size: 21px;

            line-height: 1;
        }


        /* =========================================
           FILE INFO
        ========================================= */

        .file-info {

            display: flex;
            align-items: center;

            gap: 10px;

            margin-left: 12px;

            min-width: 0;
        }


        .doc-icon {

            width: 34px;
            height: 34px;

            flex: 0 0 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;
        }


        .file-details {

            min-width: 0;
        }


        .file-name {

            font-size: 14px;

            font-weight: 600;

            color: #111827;

            max-width: 500px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .file-type {

            margin-top: 1px;

            font-size: 11px;

            color: #9ca3af;
        }


        /* =========================================
           CLOSE
        ========================================= */

        .close {

            margin-left: auto;

            border: 1px solid #e5e7eb;

            background: #ffffff;

            color: #374151;

            padding: 8px 14px;

            border-radius: 9px;

            font-size: 13px;

            cursor: pointer;

            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.08);
        }


        .close:hover {

            background: #f9fafb;
        }


        /* =========================================
           DOCUMENT VIEWER
        ========================================= */

        .viewer {

            position: absolute;

            top: 58px;
            left: 0;
            right: 0;
            bottom: 0;

            overflow: auto;

            padding: 28px 20px 60px;

            background: #eef1f5;
        }


        #docx-container {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        /* =========================================
           DOCX-PREVIEW PAGES
        ========================================= */

        .docx-wrapper {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .docx-wrapper > section.docx {

            margin-bottom: 24px !important;

            box-shadow:
                0 3px 14px rgba(0, 0, 0, 0.12);

            border: 1px solid #e5e7eb;

            background: #ffffff;
        }


        /* =========================================
           IMAGES
        ========================================= */

        #docx-container img {

            max-width: 100%;

            height: auto;
        }


        /* =========================================
           TABLES
        ========================================= */

        #docx-container table {

            max-width: 100%;
        }


        #docx-container td,
        #docx-container th {

            word-break: normal;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            min-height: 300px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #6b7280;

            font-size: 14px;
        }


        .error {

            max-width: 700px;

            margin: 40px auto;

            padding: 24px;

            border-radius: 12px;

            background: #ffffff;

            border: 1px solid #fecaca;

            color: #991b1b;

            font-size: 14px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .topbar {

                padding: 0 10px;
            }

            .file-name {

                max-width: 220px;
            }

            .viewer {

                padding:
                    15px
                    8px
                    35px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         TOP BAR
    ========================================= -->

    <div class="topbar">

        <button
            class="back"
            type="button"
            onclick="
                window.parent.postMessage(
                    {
                        type:
                            'CLOUDNEXUS_CLOSE_VIEWER'
                    },
                    window.location.origin
                )
            "
        >

            <span class="back-icon">
                ‹
            </span>

            <span>
                Back
            </span>

        </button>


        <div class="file-info">

            <div class="doc-icon">
                W
            </div>


            <div class="file-details">

                <div class="file-name">
                    {{ file_name }}
                </div>

                <div class="file-type">
                    Word Document
                </div>

            </div>

        </div>


        <button
            class="close"
            type="button"
            onclick="
                window.parent.postMessage(
                    {
                        type:
                            'CLOUDNEXUS_CLOSE_VIEWER'
                    },
                    window.location.origin
                )
            "
        >
            Close
        </button>

    </div>


    <!-- =========================================
         DOCUMENT
    ========================================= -->

    <main class="viewer">

        <div id="docx-container"></div>

<script>
async function loadDocx() {
    const fileId = "{{ file_id }}";

    const response = await fetch(
        `/api/files/${fileId}/content`,
        {
            credentials: "same-origin"
        }
    );

    if (!response.ok) {
        throw new Error(
            `DOCX download failed: ${response.status}`
        );
    }

    const arrayBuffer =
        await response.arrayBuffer();

    console.log(
        "DOCX downloaded:",
        arrayBuffer.byteLength,
        "bytes"
    );

    const container =
        document.getElementById("docx-container");

    container.innerHTML = "";

    await docx.renderAsync(
        arrayBuffer,
        container,
        null,
        {
            className: "cloudnexus-docx",
            inWrapper: true,
            breakPages: true,
            ignoreWidth: false,
            ignoreHeight: false,
            ignoreFonts: false
        }
    );

    console.log("DOCX rendered successfully");
}

loadDocx().catch(error => {
    console.error(
        "DOCX rendering failed:",
        error
    );

    document.getElementById(
        "docx-container"
    ).innerHTML = `
        <div style="
            padding:40px;
            color:#b91c1c;
            background:#fff;
            border:1px solid #fecaca;
            border-radius:12px;
        ">
            <h2>Could not render Word document</h2>
            <p>${error.message}</p>
        </div>
    `;
});
</script>

            <div class="loading">
                Loading Word document...
            </div>

        </div>

    </main>


    <!-- =========================================
         DOCX PREVIEW LIBRARY
    ========================================= -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.4.1/dist/docx-preview.min.js"></script>
    <script src="/static/docx/docx-preview.min.js"></script>
    <script>

        const fileId =
            "{{ file_id }}";


        const container =
            document.getElementById(
                "docx-container"
            );


        async function loadDocx() {

            try {

                console.log(
                    "Loading DOCX:",
                    fileId
                );


                const response =
                    await fetch(
                        `/api/files/${encodeURIComponent(fileId)}/content`,
                        {
                            method: "GET",
                            credentials: "same-origin"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `DOCX request failed: ${response.status}`
                    );

                }


                const buffer =
                    await response.arrayBuffer();


                console.log(
                    "DOCX downloaded:",
                    buffer.byteLength,
                    "bytes"
                );


                if (!buffer.byteLength) {

                    throw new Error(
                        "DOCX file is empty."
                    );

                }


                container.innerHTML = "";
                

                await docx.renderAsync(
                    buffer,
                    container,
                    null,
                    {
                        className:
                            "docx",

                        inWrapper:
                            true,

                        ignoreWidth:
                            false,

                        ignoreHeight:
                            false,

                        ignoreFonts:
                            false,

                        breakPages:
                            true,

                        renderHeaders:
                            true,

                        renderFooters:
                            true,

                        renderFootnotes:
                            true,

                        renderEndnotes:
                            true,

                        useBase64URL:
                            true,

                        experimental:
                            true
                    }
                );


                console.log(
                    "DOCX rendered successfully"
                );


            } catch (error) {

                console.error(
                    "DOCX rendering failed:",
                    error
                );


                container.innerHTML = `

                    <div class="error">

                        <h3>
                            Could not render Word document
                        </h3>

                        <p>
                            ${error.message}
                        </p>

                    </div>

                `;

            }

        }


        loadDocx();


        /* =========================================
           TEXT SELECTION → CLOUDNEXUS AI
        ========================================= */

        document.addEventListener(
            "mouseup",
            function () {

                const selection =
                    window.getSelection();


                if (!selection) {
                    return;
                }


                const text =
                    selection
                        .toString()
                        .trim();


                if (!text) {
                    return;
                }


                window.parent.postMessage(
                    {
                        type:
                            "CLOUDNEXUS_DOCX_SELECTION",

                        text: text,

                        fileId:
                            "{{ file_id }}"
                    },

                    window.location.origin
                );

            }
        );

    </script>


</body>

</html>
