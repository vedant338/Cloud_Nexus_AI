<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ file_name }}</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #ffffff;

            color: #202124;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================
           TOP BAR
        ===================================== */

        .topbar {

            height: 60px;

            display: flex;

            align-items: center;

            padding: 0 22px;

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            position: sticky;

            top: 0;

            z-index: 10;

        }


        .back {

            border: none;

            background: transparent;

            font-size: 25px;

            cursor: pointer;

            margin-right: 16px;

        }


        .filename {

            font-size: 16px;

            font-weight: 600;

        }


        /* =====================================
           DOCUMENT
        ===================================== */

        .document {

            width:
                min(
                    1000px,
                    calc(100% - 50px)
                );

            margin: 35px auto;

            padding: 35px 45px;

        }


        /* =====================================
           TEXT
        ===================================== */

        .text-content {

            width: 100%;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: break-word;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 15px;

            line-height: 1.7;

            color: #202124;

            tab-size: 4;

            min-height: 500px;

        }


        /* =====================================
           SELECTION
        ===================================== */

        ::selection {

            background: #c7d2fe;

            color: #111827;

        }

    </style>

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="topbar">

        <button
            class="back"
            onclick="window.history.back()"
        >

            ←

        </button>


        <div class="filename">

            {{ file_name }}

        </div>

    </header>



    <!-- =====================================
         DOCUMENT
    ====================================== -->

    <main class="document">

        <div
            id="textContent"
            class="text-content"
        >{{ text_content }}</div>

    </main>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>

        const fileId =
            "{{ file_id }}";


        /* =====================================
           TEXT SELECTION
        ===================================== */

        document.addEventListener(
            "mouseup",
            function () {

                const selection =
                    window.getSelection();


                if (
                    !selection ||
                    selection.isCollapsed
                ) {

                    return;

                }


                const text =
                    selection
                        .toString()
                        .trim();


                if (!text) {

                    return;

                }


                console.log(
                    "TXT selection:",
                    text
                );


                /*
                 * Send selected text
                 * back to CloudNexus Drive.
                 */

                window.parent.postMessage(

                    {

                        type:
                            "CLOUDNEXUS_TXT_SELECTION",

                        text:
                            text,

                        fileId:
                            fileId

                    },

                    window.location.origin

                );

            }
        );

    </script>


</body>

</html>
